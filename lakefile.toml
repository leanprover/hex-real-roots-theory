name = "hex-real-roots-theory"
defaultTargets = ["HexRealRootsTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyTheory"
git = "https://github.com/leanprover/hex-poly-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyZTheory"
git = "https://github.com/leanprover/hex-poly-z-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexRealRoots"
git = "https://github.com/leanprover/hex-real-roots.git"
rev = "v0.10.0"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1c497c347f615b3087cb605f8cf743e591376105"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexRealRootsTheory"

[[lean_lib]]
name = "HexRealRootsTheoryTests"
globs = ["HexRealRootsTheory.IsolateRootsTests", "HexRealRootsTheory.IsolateRootsElabTests", "HexRealRootsTheory.SturmTests", "HexRealRootsTheory.RealRootCountTests", "HexRealRootsTheory.TarskiTests"]
